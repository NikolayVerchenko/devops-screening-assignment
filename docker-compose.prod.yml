# Memory budget for the 3930 MiB production VM:
# api: 1536 MiB, db: 1024 MiB, nginx: 128 MiB = 2688 MiB maximum.
# This leaves about 1242 MiB for the OS and Docker, above the required 500 MiB minimum.

services:
  api:
    image: ${API_IMAGE:?API_IMAGE must be set}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      WEB_CONCURRENCY: "2"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    mem_limit: 1536m
    cpus: "1.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 2s
      retries: 3

  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: shop
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always
    mem_limit: 1024m
    cpus: "0.50"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.30.5
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: always
    mem_limit: 128m
    cpus: "0.20"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
